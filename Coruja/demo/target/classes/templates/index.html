<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corujão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="/enviar" method="POST">

        <h1>Corujão na Casa do Bot</h1>
        <br><br>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
        <br><br>
        <input type="text" id="vai" name="vai" placeholder="Informe se vai ou não">
        <br><br>
        <input type="text" id="levar" name="levar" placeholder="Vai levar algo? O quê?">
        <br><br>
        <button type="submit">Enviar</button>

    </form>
        <br><br>
        <form action="/quem-vai" method="GET">
            <button type="submit">Quem vai?</button>
        </form>

    <h2>Quem vai?</h2>

        <div th:each="resposta : ${respostas}">

        <p>
            Nome: <span th:text="${resposta.nome}"></span>
        </p>

        <p>
            Vai: <span th:text="${resposta.vai}"></span>
        </p>

        <p>
            Vai levar: <span th:text="${resposta.levar}"></span>
        </p>

        <hr>

    </div>

    <form action="/excluir" method="POST" class="form-excluir">
        <button type="submit">Excluir respostas</button>
    </form>
</body>
</html>
